services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapos
      POSTGRES_USER: mapos
      POSTGRES_PASSWORD: mapos
    # Same planner settings as production, so a slow query shows up here first.
    command:
      [
        "postgres",
        "-c",
        "jit=off",
        "-c",
        "work_mem=32MB",
        "-c",
        "maintenance_work_mem=256MB",
        "-c",
        "random_page_cost=1.1"
      ]
    shm_size: 256mb
    ports:
      - "5434:5432"
    volumes:
      - mapos-v3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapos -d mapos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mapos-v3-data:
