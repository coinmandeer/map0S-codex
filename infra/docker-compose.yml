services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapos
      POSTGRES_USER: mapos
      POSTGRES_PASSWORD: mapos
    ports:
      - "5434:5432"
    volumes:
      - mapos-v3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapos -d mapos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mapos-v3-data:
