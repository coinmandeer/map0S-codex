map $http_x_forwarded_proto $mapos_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_upgrade $mapos_connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 4032;
  root /usr/share/nginx/html;

  # Content-Security-Policy. The place detail can embed foreign pages, so `frame-src` is an
  # explicit allowlist rather than a wildcard — keep it in step with `frameSrcAllowlist()` in
  # apps/api/src/services/embedService.ts, which is what the UI probes against.
  #
  # `worker-src blob:` is required by MapLibre, which compiles its tile workers at runtime.
  # `style-src 'unsafe-inline'` covers React's style attributes (per-pin colours), not scripts.
  include /etc/nginx/security-headers.inc;

  # Static files are gzipped at build time (Dockerfile); send the `.gz` to clients that accept
  # it. API responses are compressed by the API itself.
  gzip_static on;
  gzip_vary on;

  location /api/ {
    proxy_pass http://api:4033/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mapos_connection_upgrade;
    proxy_read_timeout 90s;
    # Preserve the actual client hop for Fastify's address-based trustProxy chain. Fastify stops
    # at the first untrusted address, so a client-supplied leftmost X-Forwarded-For cannot win.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mapos_forwarded_proto;
  }

  location = /index.html {
    # A location with any add_header stops inheriting the server-level set, so repeat the shared
    # security include anywhere cache headers are added locally.
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Approved same-origin game assets only. A missing GLB must be an explicit 404 so the runtime
  # activates its neutral procedural fallback instead of trying to parse the SPA HTML as glTF.
  location /models/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    try_files $uri $uri/ /index.html;
  }
}
