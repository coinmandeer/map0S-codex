server {
  listen 4032;
  root /usr/share/nginx/html;

  # Content-Security-Policy. The place detail can embed foreign pages, so `frame-src` is an
  # explicit allowlist rather than a wildcard — keep it in step with `frameSrcAllowlist()` in
  # apps/api/src/services/embedService.ts, which is what the UI probes against.
  #
  # `worker-src blob:` is required by MapLibre, which compiles its tile workers at runtime.
  # `style-src 'unsafe-inline'` covers React's style attributes (per-pin colours), not scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://*.wikipedia.org https://www.openstreetmap.org https://*.mapillary.com https://embed.windy.com https://opentopomap.org https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:4033/;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    try_files $uri $uri/ /index.html;
  }
}
